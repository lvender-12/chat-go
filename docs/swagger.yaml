definitions:
  auth.UserLogin:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  auth.UserRegister:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  friends.AddFriendRequest:
    properties:
      name:
        type: string
    type: object
  friends.FriendDto:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  friends.FriendsResponse:
    properties:
      friends:
        items:
          $ref: '#/definitions/friends.FriendDto'
        type: array
    type: object
  users.UserProfile:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and create an authentication cookie
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            type: string
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid username or password
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User Register
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UserRegister'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register user
      tags:
      - Auth
  /api/v1/friend/add-friend:
    post:
      consumes:
      - application/json
      description: Send a friend request to a user by username or email. If the target
        user has already sent a friend request, the request will be accepted instead.
      parameters:
      - description: Friend request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/friends.AddFriendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Friend request sent or accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a friend
      tags:
      - friend
  /api/v1/friend/friends:
    get:
      description: Get all friends of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/friends.FriendsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get friends
      tags:
      - friend
  /api/v1/users/profile:
    get:
      description: Get the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.UserProfile'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user profile
      tags:
      - users
swagger: "2.0"
