definitions:
  app.Response:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
    type: object
  auth.UserLogin:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  auth.UserRegister:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  chat.DeleteMessageRequest:
    properties:
      id:
        type: integer
    type: object
  chat.MessageRequest:
    properties:
      content:
        type: string
    type: object
  chat.MessageWithID:
    properties:
      ID:
        type: integer
      content:
        type: string
    type: object
  friends.AddFriendRequest:
    properties:
      name:
        type: string
    type: object
  users.UserEdit:
    properties:
      display_name:
        type: string
      email:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and create an authentication cookie
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Login user
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Clear the authentication cookie and log out the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Logout user
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User Register
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UserRegister'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
      summary: Register user
      tags:
      - Auth
  /api/v1/chat/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete an existing message owned by the authenticated user
        and broadcast the updated chat through WebSocket
      parameters:
      - description: Conversation ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Message ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chat.DeleteMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Delete a message
      tags:
      - Chat
    get:
      description: Open a WebSocket connection and get chat history for a conversation
      parameters:
      - description: Conversation ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Get chat history
      tags:
      - Chat
    post:
      consumes:
      - application/json
      description: Send a message to a conversation
      parameters:
      - description: Conversation ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Message content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chat.MessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Send a message
      tags:
      - Chat
    put:
      consumes:
      - application/json
      description: Edit an existing message owned by the authenticated user and broadcast
        the updated chat through WebSocket
      parameters:
      - description: Conversation ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Message ID and new message content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chat.MessageWithID'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Edit a message
      tags:
      - Chat
  /api/v1/friend/accept-friend/{id}:
    post:
      description: Accept a pending friend request received by the currently authenticated
        user and create a conversation
      parameters:
      - description: Friend request ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Accept a friend request
      tags:
      - friend
  /api/v1/friend/add-friend:
    post:
      consumes:
      - application/json
      description: Send a friend request to a user by username or email. If the target
        user has already sent a friend request, the request will be accepted instead.
      parameters:
      - description: Friend request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/friends.AddFriendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Add a friend
      tags:
      - friend
  /api/v1/friend/friends:
    get:
      description: Get all friends of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Get friends
      tags:
      - friend
  /api/v1/friend/friends-request:
    get:
      description: Get all friends of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Get friends request
      tags:
      - friend
  /api/v1/friend/reject-friend/{id}:
    post:
      description: Reject a friend request received by the currently authenticated
        user
      parameters:
      - description: Friend request ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Reject a friend request
      tags:
      - friend
  /api/v1/users/profile:
    get:
      description: Get the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Get current user profile
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Update the profile of the currently authenticated user. Only non-empty
        fields will be updated.
      parameters:
      - description: User profile data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.UserEdit'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Edit current user profile
      tags:
      - users
  /api/v1/users/profile/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Upload or replace the current user's profile avatar. Maximum file
        size is 5 MB.
      parameters:
      - description: Profile avatar
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Upload profile avatar
      tags:
      - users
swagger: "2.0"
